name: harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            attack2patch/pyproject.toml
            attack2patch/constraints.txt
      - name: Install
        working-directory: attack2patch
        run: python -m pip install --constraint constraints.txt -e ".[dev]"
      - name: Harness checks
        shell: bash
        run: bash scripts/check.sh
      - name: Documentation gardening report
        shell: bash
        run: bash scripts/doc-gardening.sh

  docker-smoke:
    name: Docker smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            attack2patch/pyproject.toml
            attack2patch/constraints.txt
      - name: Install
        working-directory: attack2patch
        run: python -m pip install --constraint constraints.txt -e ".[dev]"
      - name: Pinned Docker boundary and DAST smoke
        working-directory: attack2patch
        run: python scripts/docker-smoke.py --expected-arch "${{ matrix.arch }}"

  github-app-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_APP_ID: ${{ secrets.ATTACK2PATCH_GITHUB_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ secrets.ATTACK2PATCH_GITHUB_APP_INSTALLATION_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.ATTACK2PATCH_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            attack2patch/pyproject.toml
            attack2patch/constraints.txt
      - name: Install
        working-directory: attack2patch
        run: python -m pip install --constraint constraints.txt -e ".[dev]"
      - name: Verify GitHub App installation without creating a PR
        working-directory: attack2patch
        run: attack2patch github-app-smoke --repository "${{ github.repository }}" --json
