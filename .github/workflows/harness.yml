name: harness

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: bash scripts/check.sh
      - run: bash scripts/check-architecture.sh
      - run: bash scripts/check-secrets.sh
