version: 1
tools:
  builtin-python:
    category: sast
    provider: autopatch.runtime.builtin_scanner:BuiltinPythonScanner
    command: null
    output: finding-schema

  semgrep:
    category: sast
    command:
      - semgrep
      - scan
      - --json
      - --metrics=off
      - --config
      - rules/semgrep
    parser: semgrep-json
    network: false

  codeql:
    category: sast
    command:
      - codeql
    parser: sarif
    enabled_by_default: false

  trivy:
    category: sca
    command:
      - trivy
      - fs
      - --format
      - json
    parser: trivy-json
    enabled_by_default: false

  osv-scanner:
    category: sca
    command:
      - osv-scanner
      - scan
      - --format
      - json
    parser: osv-json
    enabled_by_default: false

  gitleaks:
    category: secret
    command:
      - gitleaks
      - detect
      - --no-git
      - --report-format
      - json
      - --report-path
      - '-'
    parser: gitleaks-json
    enabled_by_default: false

  pytest:
    category: regression
    command:
      - python
      - -m
      - pytest
      - -q
    network: false

  compileall:
    category: build
    command:
      - python
      - -m
      - compileall
      - -q
      - .
    network: false

  codex:
    category: llm
    command:
      - codex
      - exec
    parser: strict-json-schema
    network: true
    enabled_by_default: true

  opencode:
    category: llm
    command:
      - opencode
      - run
      - --format
      - json
    parser: jsonl-events
    network: true
    enabled_by_default: false

  claude:
    category: llm
    command:
      - claude
      - --print
      - --output-format
      - json
    parser: structured-output
    network: true
    enabled_by_default: false

  zap:
    category: dast
    command:
      - zap-baseline.py
      - -t
      - TARGET
      - -J
      - zap-report.json
      - -I
    parser: zap-json
    enabled_by_default: false
    authorization_required: true

  nuclei:
    category: dast
    command:
      - nuclei
      - -u
      - TARGET
      - -jsonl
      - -silent
    parser: nuclei-jsonl
    enabled_by_default: false
    authorization_required: true

  git:
    category: scm
    command:
      - git

  gh:
    category: scm
    command:
      - gh
    enabled_by_default: false

  docker:
    category: sandbox
    command:
      - docker
    enabled_by_default: false
