services:
  api:
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: volume
        source: autopatch-runs
        target: /app/.autopatch
    environment:
      AUTOPATCH_CONFIG: /app/config/harness.yaml
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  autopatch-runs:
