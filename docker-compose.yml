services:
  attack2patch:
    build:
      context: .
      dockerfile: docker/attack2patch.Dockerfile
    environment:
      ATTACK2PATCH_DATABASE_URL: sqlite:///attack2patch.db
      ATTACK2PATCH_WORKSPACE: /app/work
      ATTACK2PATCH_DEMO_BASE_URL: http://demo-app:5000
      ATTACK2PATCH_DEPLOY_APPROVAL_REQUIRED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      demo-app:
        condition: service_healthy

  demo-app:
    build:
      context: demo-app
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 10
