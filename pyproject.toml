[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attack2patch"
version = "0.1.0"
description = "Attack log to validated patch and Docker redeployment MVP"
requires-python = ">=3.11"
dependencies = ["flask>=3.0,<4", "pydantic>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests", "demo-app/tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
