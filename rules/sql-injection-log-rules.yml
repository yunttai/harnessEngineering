rules:
  - id: sqli-boolean-bypass
    pattern: "(?i)'\\s*or\\s+(?:'[^']*'|\\d+|\\w+)\\s*="
  - id: sqli-union-select
    pattern: "(?i)\\bunion\\s+(?:all\\s+)?select\\b"
  - id: sqli-comment
    pattern: "(?i)(--|/\\*)"
  - id: sqli-time-delay
    pattern: "(?i)\\b(sleep|benchmark)\\s*\\("
  - id: sqli-stacked-query
    pattern: "(?i);\\s*(select|insert|update|delete)\\b"
